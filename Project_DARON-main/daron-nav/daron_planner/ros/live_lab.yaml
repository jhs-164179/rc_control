# 실시간 경로계획 파라미터 (261006, [261015] 완전 자율 설정 live_auto.yaml 을 합침 — 케일럽 '(라)')
# 팀 레포 제어창 launch(daron_gui / daron_3dmap planner:=true)의 기본 planner_params. 실제 센서·SLAM·지도·판정 노드와 같이 뜬다.
# [261015] 경기장을 놓기 전 = '연구실 범위'(SLAM 시작 자리 둘레 8 x 8 m, 경계 근처 미관측 금지 끔) → 예전 live_lab 과 같은 격자, 평소 웨이포인트 주행.
#          제어창 [여기가 출발점](/ui/field here) = 4 x 5 m 경기장(경계 안쪽 0.3 m 미관측 금지) → 자율 가능, 웨이포인트도 경기장 안만.
#          [경기장 풀기](/ui/field clear) = 다시 연구실 범위. [여기가 출발점] 경기장에는 페이즈2 가 붙음(아래 p2_*, 크기·위치 [가정]).
# 나머지 값(health_rules, method 등)은 planner_node.py 기본값 = planner_params.yaml 과 같음.
daron_planner:
  ros__parameters:
    use_sim_time: false
    odom_frame: map                  # [10/11] 실시간 = map 좌표 (피쳐맵·판정·웨이포인트·pose_relay 모두 map, 10/8 석윤님)
    grid_mode: replace               # [10/11] 판정이 피쳐맵 전체(judge_extent=map)를 매번 보냄 → 쌓지 않고 그대로 씀
    goal_pose_heading: true          # [10/11] /goal_pose orientation = 도착 방향 (RViz 2D Goal Pose 는 끌어서 방향을 줄 것)
    lab_until_set: true              # [261015] 경기장 놓기 전 = 연구실 범위 (아래 두 줄), AUTO 거부
    lab_size: [8.0, 8.0]             #   SLAM 시작 자리 둘레 4 m 까지 (사실상 경계 없음, 예전 field_size 8x8 와 같음)
    lab_edge_unknown_m: 0.0          #   경계 근처 미관측 금지 끔 (경계가 없으니)
    field_size: [4.0, 5.0]           # [AUTO] 경기장 4 x 5 m (제어창 [여기가 출발점]이 크기·출발 자리를 다시 보냄)
    start_in_field: [-1.4, -2.07, 1.5707963]   # [AUTO] 기본 출발 자리 (왼쪽 아래 구석, +y 를 봄 [가정]). 실제 자리는 [여기가 출발점]
    edge_unknown_m: 0.30             # [AUTO] 경기장 끝 안쪽 0.3 m 미관측 금지 (경기장 끝 낭떠러지 대비, 코드 기본값)
    field_require_set: true          # [AUTO] 경기장 놓기 전엔 AUTO 안 함
    auto_points: true                # [AUTO] 방문점(기본 3x4)을 골라 지나간 뒤 틈
    auto_goal_in_field: [-1.5, 2.3]  # [AUTO] 틈 기본값 [가정] — 제어창 틈 칸·[틈 찍기]로 바꿈. 페이즈2 입구도 이 x 를 따라감
    # [261015 케일럽 '(가)'] 놓은 경기장 = 페이즈1 + 페이즈2 (+y 변 위). 사이 변은 벽, 입구(틈 x ± gap_w/2)만 열림. 웨이포인트는 둘 다, 자율 방문점은 페이즈1 만
    #   값은 10/5 주최측 배치안 그림을 해석한 것 [가정] → 연습 주행 때 재서 여기만 고침 (경기장마다 한 번. 제어창에선 안 바꿈)
    #   붙는 자리를 바꾸면 틈(제어창 틈 칸)도 실제 입구로 옮길 것 — 입구 = 틈 x ± gap_w/2 를 페이즈2 폭으로 자른 곳
    p2_enable: true
    p2_size: [3.0, 4.0]              # 페이즈2 x 폭, y 깊이 [m] [가정]
    p2_align: left                   # 페이즈2 가 위쪽 변 어디에: left(왼쪽 끝 맞춤) | center(가운데) | right(오른쪽 끝 맞춤) | x [가정: left = x -2 ~ 1]
    p2_x: 0.0                        #   p2_align: x 일 때만 — 페이즈2 가운데 x (페이즈1 가운데 = 0, +x = 오른쪽, 출발 구석 = 왼쪽 아래)
    gap_w: 1.2                       # 입구 폭 [m] [가정] (차가 지나갈 폭 = 1.2 - 2 x 0.296 = 0.61 m)
    replan_period_s: 0.5             # [261015] 10/14 케일럽 '지도·판정·경로계획 주기 셋 다 0.5 s' (코드 기본 2.0). 지도·판정이 2 s 면 효과 적음
    lander_enable: false
    method: smooth
    default_mode: WAYPOINT           # 모드 화면 없이 바로 웨이포인트(RViz 2D Goal Pose). AUTO 는 제어창 [자율] = /ui/mode AUTO
    waypoint_queue: true             # [10/7 케일럽] 여러 점 줄 세우기 (도착하면 다음 점)
    click_remove_m: 0.2              # 찍은 점 0.2 m 안을 다시 찍으면 그 점 지움
    path_republish_hz: 0.0           # [10/7] 같은 경로 다시 안 보냄: 현성님 추종기는 경로를 받을 때마다 속도·조향을 0부터 다시 올림 (그쪽이 같은 stamp 무시하면 1.0 으로)
    hold_kept_path: true             # [10/7] 계획이 '직전 길 유지'면 경로를 다시 보내지 않음 (추종기 초기화 횟수 절반, 가짜 ROS U턴 20.2 → 16.6 s)
    hold_kept_max_dev_m: 0.15        # [261016] 단, 경로에서 이만큼 벗어났으면 보냄 (< 추종기 e_abort 0.30 — 예전엔 둘이 서로 기다리며 멈춤, 10/14 로그 10.9 s)
    hold_kept_max_s: 3.0             # [261016] 단, 마지막 송신 뒤 이만큼 지나면 보냄 (늦게 뜬·재시작한 추종기가 경로를 못 받던 문제)
    require_health: true             # /health/state 가 끊기면 정지 (실시간 파이프라인엔 있음)
    grid_timeout_s: 3.0
    log_dir: ''                      # 실행할 때 -p log_dir:=... 로 줌
    map_cloud_topic: ''                     # [10/8 끔] 높이 표시는 석윤님 코드가 함(우분투). 켜면 /live_tsdf/map_cloud: 웨이포인트·경로를 바닥 높이에 (표시만)
    clicked_point_topic: ''                 # [10/8 끔] 석윤님 코드와 겹치지 않게. 켜면 /clicked_point (RViz Publish Point = 웨이포인트)
    path_in_judge_window: true              # [10/7 케일럽] /planner/path 를 판정 창(1.25 m) 안으로만. 그 너머는 판정이 없음
    # [10/11 저녁] 방위각 튜닝·백업 — 값 = 코드 기본값 (바꾸면 docs/DARON_261011_튜닝값.md '바꾼 기록'에 한 줄)
    head_r_margin: 1.2                      # 방향 맞춤 경로 반경 = 최소 회전반경 x 1.2 (슬립이 크면 키움)
    head_time_s: 0.5                        # 방향 탐색 한도 (시간)
    head_expand: 30000                      #   (뻗는 횟수)
    head_weight: 1.5                        # 남은 길 예상 가중 (1 = 최적)
    # 1차 시험 = 관찰만 (이탈·회전 비율을 status·로그로 봄). 2차 = dev_replan 0.15 / 30 + turn_adapt true 같이 (시뮬: 둘을 같이 켜야 나아짐)
    dev_replan_m: 0.0                       # 경로 이탈 → 바로 다시 계획 (0 = 끔, 2차 0.15)
    dev_replan_deg: 0.0                     #   (2차 30)
    turn_adapt: false                       # 조향 지령 기준 회전 비율로 계획 반경 키움 (2차 true)
    head_retry_max: 2                       # 방향 못 맞추고 지나친 횟수 한도 → heading_fail 대로
    head_retry_near_m: 8.0                  # 목표 1.5 m 안 주행 한도
    stuck_action: warn                      # 헛바퀴: warn(표시만) | stop(STUCK 정지)
