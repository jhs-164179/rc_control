# path_follower 파라미터 (Stanley 계열 곡률 제어, CLAUDE.md §5)
#   python3 path_follower.py --ros-args --params-file config/follower.yaml
# 실수형은 반드시 소수점을 붙인다 (10 이 아니라 10.0). ROS 2 는 타입이 다르면 거부한다.
# 여기 없는 값은 follower_core.FollowerParams / path_follower.py 의 기본값을 쓴다.
# 이전 PID 판: daron_run/backup/follower.yaml.bak_261011_pre-stanley
path_follower:
  ros__parameters:
    # ---------- 입출력 ----------
    path_topic: /planner/path
    pose_topic: /localization/pose
    odom_topic: /rover/odom
    debug_topic: /follower/debug
    rover: /rover
    map_frame: map              # 경로·pose 는 둘 다 map 좌표 [m] (픽셀 아님)
    # [261012] receive: RADXA·지상국 시계 동기(chrony) 미확인이라 수신 간격으로 판정. pose 보간은 원래 수신 시각 기준이라 제어는 같다.
    #   pose 자체가 오래된 경우는 pose_relay 가 막는다 (TF 나이 > max_age_s 0.5 s 면 /localization/pose 를 안 냄).
    #   header 로 써도 된다: TF stamp = EKF-C 의 마지막 측정(IMU) 시각이라 나이가 수십 ms (영상 지연 350~390 ms 아님, PATH_TRACKING §9-1)
    pose_stamp_source: receive  # header (chrony 동기화 전제) | receive (동기화 안 됐을 때)
    control_hz: 50.0
    pose_timeout_s: 0.3         # 이보다 오래되면 STOP_STALE. receive = 마지막 수신 후 (pose_relay 20 Hz → 6 번 연속 안 옴)
    odom_timeout_s: 0.5
    use_odom_propagation: true
    start_enabled: false
    link_resume_max_s: 3.0      # [261016] 로버 진단이 이만큼 끊기면 추종을 스스로 끔 → 제어창 [재개] (짧은 끊김은 자동으로 이어 감). 0 = 끔
    allow_reverse: false        # 전진만 (true 여도 후진하지 않음)
    log_dir: logs

    # ---------- 구동계 (TODO 실측값) ----------
    wheel_diameter_m: 0.108    # 0 = 미설정 -> 구동 안 함
    gear_ratio: 40.0          # 모터 회전 / 바퀴 회전
    min_rpm: 0.0             # 모터 rpm
    max_rpm: 600.0           # 모터 rpm. config/*.json 의 max_speed 이하

    # ---------- 조향: Stanley 곡률 제어 ----------
    k_e: 1.5                 # [1/m] 주 게인. 권장 1.0 ~ 2.5. 수렴 길이 ~ 1/(2 k_e)
    k_th_ratio: 4.0          # k_th = ratio * k_e. 4 = 임계감쇠, 진동하면 5 ~ 6
    k_i: 0.0                 # [1/m^3] 적분. 기본 꺼짐 (경사에서 0.5 부터)
    I_max: 0.5               # [1/m]
    e_I_max: 0.10            # [m] 이 오차보다 작을 때만 적분
    gain_scale: 1.0          # Fuzzy GS 자리. 1.0 고정
    kappa_max: 1.0986         # [1/m] 조향 한계 곡률 (R_min 0.910 m)
    delta_max_deg: 20.0      # [deg] 차량 유효조향각 한계 (l12_driver.DEFAULT_STEER_LIMIT_DEG)
    kappa_rate: 5.5          # [1/(m s)] TODO L12 full swing 실측: 2 * kappa_max / T_full
    # [261015] 언더스티어 보정 = 조향 지령 곡률 / 실제 곡률 = 1 / 회전 비율. 1.0 = 끔
    #   회전 비율은 planner status 의 backup.turn_ratio (실제/지령, 조향 지령 기준) 로 잰다. 예: 0.85 -> 1.18
    #   최대 조향은 그대로라 실제 최소 회전반경은 R_min / 회전 비율 로 커진다 (추종기가 그만큼 일찍 포화로 본다)
    #   런타임: ros2 param set /path_follower understeer_gain 1.15
    understeer_gain: 1.11      # [261015] 회전 비율 0.9 가정 (1 / 0.9). 실측 turn_ratio 로 다시 맞출 것
    preview_m: 0.05          # [m] 곡률 feedforward 미리보기 (~ v * tau_act)

    # ---------- 속도 ----------
    # [261017] 모터 rpm = 60·G·v/(π·D) ≈ 7074·v (G 40, D 0.108) → max_rpm 600 은 약 0.085 m/s. 0.15 는 낼 수 없는 값이라
    #   항상 rpm 상한에 걸려 곡률 감속(×0.6)이 전혀 듣지 않았다. 상한 아래로 두어야 감속 로직이 산다.
    v_max_mps: 0.08          # = v_nom
    v_min: 0.05
    e1: 0.05                 # [m] CTE 감속 시작
    e2: 0.15                 # [m] CTE 감속 끝 (v_min)
    curv_slow_ratio: 0.8
    curv_slow_factor: 0.6
    a_max: 0.3               # [m/s^2] 속도 rate 제한 (정지는 즉시)

    # ---------- 종료 / 안전 ----------
    end_tol: 0.02            # [m] remaining < end_tol -> STOP_END
    e_abort: 0.30            # [m] |e_y| > e_abort -> HOLD_DEVIATION
    new_path_search_m: 0.5   # [m] 새 경로 최근접점 탐색 범위 (앞쪽)
    # [261016] pose 점프·방향 이탈 -> HOLD_DEVIATION (새 경로 대기). 근거는 follower_core.FollowerParams 주석
    jump_m: 0.08             # [m] 주기 사이 pose 이동 (정상 p99.9 3.2 cm, 10/14 점프 9~26 cm)
    jump_deg: 15.0           # [deg] 주기 사이 yaw 변화 (정상 p99.9 3.6°, 점프 58°)
    e_th_abort_deg: 75.0     # [deg] |e_th| 한계 (Stanley 전제 < 90°, 로그 최대 56.7°)
